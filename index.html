<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><title>EcoSthock | Control Inteligente de Mermas</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}body{background:#f3f6f8;color:#1f2937}
header{background:#1b7a43;color:#fff;padding:14px 32px;display:flex;justify-content:space-between;align-items:center}
.nav-btn{border:none;padding:8px 16px;border-radius:6px;font-weight:700;cursor:pointer;margin-left:8px}
.active{background:#fff;color:#1b7a43}.inactive{background:rgba(255,255,255,.2);color:#fff}
.wrap{max-width:1100px;margin:24px auto;padding:0 16px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:#fff;padding:16px;border-radius:10px;border-left:4px solid #1b7a43;box-shadow:0 2px 6px rgba(0,0,0,.04)}
.kpi small{color:#6b7280;font-weight:700;font-size:11px;display:block}.kpi b{font-size:26px}
.grid{display:grid;grid-template-columns:340px 1fr;gap:20px}.card{background:#fff;padding:20px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.04)}
.btn{width:100%;padding:10px;border:none;border-radius:7px;font-weight:700;cursor:pointer;color:#fff;margin-top:8px}
input,select{width:100%;padding:8px;border:1px solid #d1d5db;border-radius:6px;margin:4px 0 10px}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}th,td{padding:10px;text-align:left;border-bottom:1px solid #eee}
.tag{padding:3px 8px;border-radius:12px;font-size:11px;font-weight:700}.flash{background:#fef3c7;color:#92400e}.don{background:#fee2e2;color:#991b1b}
.hide{display:none}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:14px}
</style>
</head>
<body>
<header>
  <div><b>🌱 EcoSthock</b> | Control Inteligente de Mermas</div>
  <div>
    <button id="b1" class="nav-btn active" onclick="ver(1)">🏪 Panel Comerciante</button>
    <button id="b2" class="nav-btn inactive" onclick="ver(2)">🛒 Vista Consumidor</button>
  </div>
</header>
<div id="v1" class="wrap">
  <div class="kpis">
    <div class="kpi"><small>LOTES MONITOREADOS</small><b id="k1">0</b></div>
    <div class="kpi" style="border-color:#f59e0b"><small>ALERTAS (&lt; 72 HRS)</small><b id="k2">0</b></div>
    <div class="kpi" style="border-color:#3b82f6"><small>OFERTAS FLASH ACTIVAS</small><b id="k3">0</b></div>
    <div class="kpi" style="border-color:#8b5cf6"><small>AHORRO / RESCATE</small><b id="k4">$0</b></div>
  </div>
  <div class="grid">
    <div class="card">
      <h3>📷 Alta Rápida de Lote</h3>
      <button type="button" class="btn" style="background:#1e293b;margin-bottom:10px" onclick="scan()">⚡ Simular Escaneo QR/Barras</button>
      <label>Código</label><input id="cod" placeholder="7501001234567">
      <label>Producto</label><input id="prod" placeholder="Pan Integral Artesanal">
      <label>Categoría</label><select id="cat"><option>Panadería</option><option>Lácteos</option><option>Frutas y Verduras</option></select>
      <label>Cantidad</label><input id="cant" type="number" value="10">
      <label>Precio Base ($ MXN)</label><input id="prec" type="number" value="50">
      <label>Caducidad</label><select id="hrs"><option value="24">24 hrs (Oferta Flash -50%)</option><option value="48">48 hrs (Preventivo)</option><option value="6">6 hrs (Donación)</option></select>
      <button type="button" class="btn" style="background:#16a34a" onclick="add()">Registrar en Inventario</button>
    </div>
    <div class="card">
      <h3>📦 Inventario y Alertas en Tiempo Real</h3>
      <table><thead><tr><th>Producto</th><th>Cant.</th><th>Caducidad</th><th>Estado</th></tr></thead><tbody id="tb"><tr><td colspan="4" style="color:#999;text-align:center;padding:20px">Sin lotes registrados</td></tr></tbody></table>
    </div>
  </div>
</div>
<div id="v2" class="wrap hide">
  <div class="card">
    <h3>🛒 Ofertas Flash Cercanas — Rescata Alimentos con 50% OFF</h3>
    <div id="of" class="cards"></div>
  </div>
</div>
<script>
const m=[{c:'7501001234567',p:'Pan Integral Artesanal',g:'Panadería',n:8,r:55,h:'24'},{c:'7501099881122',p:'Queso Panela 400g',g:'Lácteos',n:5,r:80,h:'24'},{c:'7502233445566',p:'Baguette Rústica',g:'Panadería',n:12,r:35,h:'6'}];
let i=0,db=[];
function scan(){const x=m[i++%m.length];cod.value=x.c;prod.value=x.p;cat.value=x.g;cant.value=x.n;prec.value=x.r;hrs.value=x.h}
function add(){if(!prod.value)return;const h=+hrs.value;db.push({p:prod.value,g:cat.value,n:+cant.value,r:+prec.value,h,e:h<=6?'Donación Banco':h<=24?'Oferta Flash (-50%)':'Preventivo'});cod.value='';prod.value='';render()}
function render(){tb.innerHTML=db.map(x=>`<tr><td><b>${x.p}</b><br><small>${x.g}</small></td><td>${x.n} u.</td><td>${x.h} hrs</td><td><span class="tag ${x.h<=6?'don':'flash'}">${x.e}</span></td></tr>`).join('');k1.innerText=db.length;k2.innerText=db.length;k3.innerText=db.filter(x=>x.h===24).length;k4.innerText='$'+db.reduce((a,x)=>a+x.r*x.n*.5,0);of.innerHTML=db.filter(x=>x.h<=24).map(x=>`<div class="card" style="border-top:4px solid #2563eb"><b>${x.p}</b><p style="font-size:12px;color:#666">${x.g} • Vence en ${x.h}h</p><p style="margin:8px 0"><s style="color:#999">$${x.r}</s> <b style="color:#16a34a;font-size:20px">$${x.r/2} MXN</b></p><button class="btn" style="background:#1b7a43" onclick="alert('¡Apartado con éxito!')">Apartar</button></div>`).join('')||'<p>Registra productos primero</p>'}
function ver(n){v1.classList.toggle('hide',n!==1);v2.classList.toggle('hide',n!==2);b1.className='nav-btn '+(n===1?'active':'inactive');b2.className='nav-btn '+(n===2?'active':'inactive')}
</script>
</body>
</html>
